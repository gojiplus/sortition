[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sortition"
version = "0.1.0.dev0"
description = "Counterfactual evaluation for LLM routing policies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = [
    "off-policy-evaluation",
    "contextual-bandits",
    "llm-routing",
    "causal-inference",
    "doubly-robust",
    "litellm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# The eval path must install without litellm or fastapi: it has to run on a
# laptop against someone else's parquet file.
eval = [
    "scipy>=1.14",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    # The default estimator is doubly robust, so a cross-fitted outcome model is
    # part of the eval path rather than an optional upgrade to it.
    "scikit-learn>=1.5",
]
train = [
    "sortition[eval]",
    "lightgbm>=4.5",
]
litellm = ["litellm>=1.92"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
cli = ["sortition[eval]", "typer>=0.12", "rich>=13.0"]
all = ["sortition[eval,train,litellm,serve,cli]"]

[project.urls]
Homepage = "https://github.com/soodoku/sortition"
Repository = "https://github.com/soodoku/sortition"
Issues = "https://github.com/soodoku/sortition/issues"

[project.scripts]
sortition = "sortition.cli:main"

[dependency-groups]
dev = [
    "sortition[all]",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/sortition"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
    "N",    # pep8-naming
]
ignore = [
    # Statistical code reads better with the field's own notation: n, p, q, X, y.
    "N803",
    "N806",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B018"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src/sortition"]

[[tool.mypy.overrides]]
module = ["scipy.*", "lightgbm.*", "sklearn.*", "duckdb.*", "litellm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    # Coverage simulations need thousands of replications to be meaningful.
    # Reduced locally, full count in CI.
    "slow: statistical validation requiring many replications",
]
