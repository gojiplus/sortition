[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "sortition"
description = "Counterfactual evaluation for LLM routing policies"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Gaurav Sood", email = "gsood07@gmail.com" }]
keywords = [
    "off-policy-evaluation",
    "contextual-bandits",
    "llm-routing",
    "causal-inference",
    "doubly-robust",
    "litellm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "pydantic>=2.9",
]
dynamic = ["version"]

[project.optional-dependencies]
# The eval path must install without litellm or fastapi: it has to run on a
# laptop against someone else's parquet file.
eval = [
    "scipy>=1.14",
    "polars>=1.0",
    "duckdb>=1.0",
    "pyarrow>=17.0",
    # The default estimator is doubly robust, so a cross-fitted outcome model is
    # part of the eval path rather than an optional upgrade to it.
    "scikit-learn>=1.5",
]
train = [
    "sortition[eval]",
    "lightgbm>=4.5",
]
litellm = ["litellm>=1.92"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
cli = ["sortition[eval]", "typer>=0.12", "rich>=13.0"]
all = ["sortition[eval,train,litellm,serve,cli]"]

[project.urls]
Homepage = "https://github.com/soodoku/sortition"
Repository = "https://github.com/soodoku/sortition"
Issues = "https://github.com/soodoku/sortition/issues"

[project.scripts]
sortition = "sortition.cli:main"

[dependency-groups]
dev = ["sortition[all]", "pytest>=8.3", "pytest-cov>=5.0", "hypothesis>=6.100", "ruff>=0.7", "pyright>=1.1.390", "pydoclint>=0.5", "deptry>=0.20", "codespell>=2.4"]
docs = ["sphinx>=8", "furo", "myst-parser", "sphinx-copybutton", "py-canon @ git+https://github.com/gojiplus/py-canon@v1"]

[tool.hatch.build.targets.wheel]
packages = ["src/sortition"]

[tool.hatch.version]
source = "uv-dynamic-versioning"
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
external = ["DOC"]
select = ["E", "W", "F", "I", "B", "C4", "UP", "N", "D", "S", "SIM", "T20", "PT", "RUF"]
ignore = ["D203", "D213", "N803", "N806"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D"]
"docs/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    # Coverage simulations need thousands of replications to be meaningful.
    # Reduced locally, full count in CI.
    "slow: statistical validation requiring many replications",
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"

[tool.pydoclint]
style = "google"
arg-type-hints-in-docstring = false
check-return-types = false
check-class-attributes = false
allow-init-docstring = true
exclude = '\.venv|tests|docs'

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
