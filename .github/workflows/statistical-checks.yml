name: Statistical checks

# Two properties the fleet's reusable CI cannot know about. Kept in their own
# workflow because .github/workflows/ci.yml is preen-managed and `preen update`
# would overwrite anything added there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-simulations:
    # Estimator coverage is only meaningful at high replication counts, which
    # are too slow for a local edit-test loop. CI runs them at full size.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --all-extras --all-groups
      - run: uv run pytest
        env:
          SORTITION_FULL_SIMS: "1"

  minimal-install:
    # The eval path is the adoption surface: someone with a parquet file of
    # routing logs must be able to use it without installing a gateway. If a
    # stray import creeps in, this fails.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: uv venv
      - run: uv pip install '.[eval]'
      - name: Import the eval path with no gateway installed
        # .venv/bin/python directly, not `uv run`: uv run re-syncs the project
        # and would pull in the dev group, which depends on sortition[all] and
        # therefore litellm -- defeating the isolation this job exists to prove.
        run: |
          .venv/bin/python -c "
          import importlib.util
          import sortition.eval, sortition.schema, sortition.sim, sortition.targets
          for forbidden in ('litellm', 'fastapi', 'lightgbm'):
              assert importlib.util.find_spec(forbidden) is None, forbidden
          print('eval path imports clean')
          "
